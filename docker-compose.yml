services:
  hoardarr:
    image: ghcr.io/jaenster/hoardarr:latest
    container_name: hoardarr
    restart: unless-stopped

    environment:
      # Match these to your host user so files in the bind mounts
      # below end up owned by you, not by the container's runtime user.
      # `id -u` and `id -g` on the host show your values.
      - PUID=1000
      - PGID=1000
      # IANA zone — affects log timestamps + webhook payload "delivered_at".
      - TZ=Etc/UTC
      # Override anything else from config.toml without editing the file.
      # - HOARDARR_LOG_LEVEL=info
      # - HOARDARR_URL_BASE=/hoardarr   # only when behind a path-prefix proxy

    volumes:
      # /data is the canonical mount point for all hoardarr state:
      # config.toml (auto-generated), SQLite DB, sessions, logs.
      - ./data:/data
      # Downloads: incomplete/ holds in-flight job data; complete/ is
      # where finished releases land. Point complete/ at the same dir
      # your *arr stack reads from so imports don't need a copy step.
      - /srv/media/incomplete:/data/incomplete
      - /srv/media/complete:/data/complete

    ports:
      - "8085:8085"

    healthcheck:
      test: ["CMD", "/usr/local/bin/hoardarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
