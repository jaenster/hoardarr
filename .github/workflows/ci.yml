name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod / go.sum drifted from `go mod tidy`. Run it locally and commit."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # HOARDARR_USENET_TEST gates real-provider integration tests
        # (env-checked at runtime; left unset on CI so they skip
        # cleanly).
        env:
          HOARDARR_USENET_TEST: ""
        run: go test -race -timeout=10m ./...

  build:
    name: make build
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: cd frontend && npm ci

      - name: tsc + vite build
        run: cd frontend && npm run build

      - name: go build (embedded)
        # Mirror the Makefile ldflags so the smoke run reports the
        # same identification a release build would. CI builds aren't
        # tagged, so VERSION falls through to the "dev-<sha>" form.
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short=12 HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -tags embed -trimpath \
            -ldflags="-s -w \
              -X main.version=${VERSION} \
              -X main.commit=${COMMIT} \
              -X main.buildDate=${BUILD_DATE}" \
            -o ./hoardarr ./cmd/hoardarr

      - name: smoke run version + --help
        run: |
          ./hoardarr version
          ./hoardarr serve -h 2>&1 || true

  playwright:
    name: playwright e2e
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: cd frontend && npm ci

      - name: install playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: build embedded binary
        run: |
          cd frontend && npm run build && cd ..
          go build -tags embed -o ./hoardarr ./cmd/hoardarr
          go build -o ./testserver-nntpd ./cmd/testserver-nntpd

      - name: run playwright
        run: cd frontend && npx playwright test --reporter=line

      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
