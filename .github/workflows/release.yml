name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # id-token: write — OIDC for sigstore-keyless signing.
  # attestations: write — stores the signed attestation in the repo
  # (per-binary, downloadable via `gh attestation download` or
  # verifiable via `gh attestation verify <file> --repo …`).
  id-token: write
  attestations: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser uses `git describe`, which needs the full history.
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance over every release tarball + the
      # checksums file goreleaser produced. Verify with:
      #
      #   gh attestation verify hoardarr_0.1.2_linux_amd64.tar.gz \
      #     --repo jaenster/hoardarr
      - name: attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hoardarr_*.tar.gz
            dist/checksums.txt
